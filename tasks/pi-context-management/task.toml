schema_version = "1.4"
artifacts = ["/workspace/pi/packages"]

[task]
name = "ai-infra-bench/pi-context-management"
version = "0.0.2"
description = "Add model-controlled context windows, persistent notes, and selective history recovery to one Pi session."
authors = [{ name = "AI Infra Bench" }]
keywords = ["pi", "agent-harness", "context", "memory", "persistence", "cpu"]

[metadata]
benchmark_schema_version = "0.1"
track = "representative"
workload_type = "feature"
subsystems = ["agent_harness", "context_management", "memory"]
repository = "earendil-works/pi"
base_commit = "71dca871bc80b6bc97be37f0ca3189399d651fff"
dependency_cutoff = "2026-09-11T17:42:45Z"
publication_state = "development"

[agent]
timeout_sec = 36000
user = "agent"
network_mode = "no-network"

[environment]
accelerator = "CPU"
build_timeout_sec = 7200
cpus = 4
memory_mb = 8192
storage_mb = 20480
workdir = "/workspace/pi"
network_mode = "no-network"

[verifier]
timeout_sec = 1800
user = "root"
network_mode = "no-network"
