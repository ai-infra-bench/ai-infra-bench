schema_version = "1.4"
artifacts = ["/workspace/pi/packages"]

[task]
name = "ai-infra-bench/pi-subagent-live-messaging"
version = "0.0.9"
description = "Let concurrent Pi subagents share findings in their next model turn with team isolation and lifecycle-safe delivery."
authors = [{ name = "AI Infra Bench" }]
keywords = ["agent-harness", "pi", "subagents", "messaging", "concurrency", "cpu"]

[metadata]
benchmark_schema_version = "0.1"
track = "representative"
workload_type = "feature"
subsystems = ["agent_harness", "subagents", "messaging"]
repository = "earendil-works/pi"
base_commit = "71dca871bc80b6bc97be37f0ca3189399d651fff"
dependency_cutoff = "2026-09-11T17:42:45Z"
publication_state = "development"

[agent]
timeout_sec = 36000
user = "agent"
network_mode = "no-network"

[environment]
accelerator = "CPU"
build_timeout_sec = 7200
cpus = 4
memory_mb = 8192
storage_mb = 20480
workdir = "/workspace/pi"
network_mode = "no-network"

[verifier]
timeout_sec = 1800
user = "root"
network_mode = "no-network"
