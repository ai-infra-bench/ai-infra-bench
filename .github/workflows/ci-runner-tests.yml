name: CI runner tests

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.agents/skills/ai-infra-bench-task-review/scripts/**'
      - '.github/workflows/ci-runner-tests.yml'
      - 'tools/sync_collect_hooks.py'
      - 'tools/normalize_task_configs.py'
      - 'tools/normalize_image_manifests.py'
      - 'templates/vllm-harbor-all-in-one/**'
      - 'tasks/**/task.toml'
      - 'tasks/**/environment/build-config.json'
      - 'tasks/**/environment/image-manifest.json'
      - 'tasks/**/validation/**'
      - 'templates/harbor-task/task.toml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.agents/skills/ai-infra-bench-task-review/scripts/**'
      - '.github/workflows/ci-runner-tests.yml'
      - 'tools/sync_collect_hooks.py'
      - 'tools/normalize_task_configs.py'
      - 'tools/normalize_image_manifests.py'
      - 'templates/vllm-harbor-all-in-one/**'
      - 'tasks/**/task.toml'
      - 'tasks/**/environment/build-config.json'
      - 'tasks/**/environment/image-manifest.json'
      - 'tasks/**/validation/**'
      - 'templates/harbor-task/task.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-pool:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test allocation and cancellation without GPUs
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Check validation shell syntax
        run: bash -n .github/scripts/run_task_validation.sh
