name: Publish task images

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: Comma-separated task directory names, or all
        required: true
        default: all
        type: string

permissions:
  contents: read
  packages: write

jobs:
  require-main:
    runs-on: ubuntu-24.04
    steps:
      - name: Require the protected main branch
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "Task images can only be published from main." >&2
            exit 1
          fi

  discover:
    needs: require-main
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select tasks and trusted runners
        id: discover
        env:
          REQUESTED_TASKS: ${{ inputs.tasks }}
        run: |
          set -euo pipefail
          matrix="$(
            python3 .github/scripts/task_ci.py discover \
              --mode manual \
              --tasks "$REQUESTED_TASKS"
          )"
          printf 'Selected matrix: %s\n' "$matrix"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  validate-and-publish:
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: Publish ${{ matrix.task }}
    runs-on: ${{ matrix.runs_on }}
    environment:
      name: image-publication
    timeout-minutes: 240
    env:
      TASK_NAME: ${{ matrix.task }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      HARBOR_VERSION: 0.22.0
      PUBLISH_IMAGE: "true"
      GHCR_REPOSITORY: ghcr.io/${{ github.repository_owner }}/ai-infra-bench-task-envs

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Harbor
        run: |
          set -euxo pipefail
          python -m pip install "harbor==${HARBOR_VERSION}"
          harbor --version

      - name: Validate every case and publish cache miss
        run: bash .github/scripts/run_task_validation.sh

      - name: Upload Harbor logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task-publication-${{ matrix.task }}
          path: harbor-jobs/${{ matrix.task }}/
          if-no-files-found: warn
          retention-days: 30
