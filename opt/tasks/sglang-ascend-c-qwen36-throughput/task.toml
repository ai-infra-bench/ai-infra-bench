schema_version = "1.4"
artifacts = ["/workspace/sglang", "/workspace/task"]

[task]
name = "infra-bench-opt/sglang-ascend-c-qwen36-throughput"
version = "1.0.0"
description = "Improve native SGLang throughput on Ascend C while preserving model correctness across input lengths."
keywords = ["sglang", "inference", "throughput", "long-context"]

[metadata]
domain = "inference"
task_type = "performance"
base_commit = "127b9e3283f7c2a43234b852ff5c9f1796d53624"
dependency_cutoff = "2026-10-18T00:00:00Z"

[environment]
workdir = "/workspace/sglang"
os = "linux"
cpus = 16
memory_mb = 131072
storage_mb = 204800
gpus = 8
gpu_types = ["Ascend C"]
network_mode = "host"
build_timeout_sec = 10800

[agent]
timeout_sec = 14400

[verifier]
timeout_sec = 21600
