[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-infra-bench"
version = "0.1.0"
description = "Reproducible analysis and task tooling for AI Infra Bench"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
report = [
  "xlsxwriter>=3.2",
]

[project.scripts]
aib-rq1 = "ai_infra_bench.rq1.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_infra_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
